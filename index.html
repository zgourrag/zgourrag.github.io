<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>zakaryae-os</title>
<style>
:root{--bg:#151515;--wall:#151515;--fg:#f5f5f5;--ac:#C6F22D;--ink:#151515;--pn:#1d1d1d;--tx:#f5f5f5;--ln:#f5f5f5}
[data-theme=acid]{--wall:conic-gradient(from 20deg at 30% 40%,#ff3ea5,#ffe600,#00e5ff,#7c4dff,#ff3ea5);--fg:#fff;--ac:#ffe600;--ink:#1a0033;--pn:#2a0a4d;--tx:#fff;--ln:#ffe600}
[data-theme=matrix]{--wall:#000;--fg:#33ff66;--ac:#00ff41;--ink:#000;--pn:#041a07;--tx:#33ff66;--ln:#00ff41}
[data-theme=xp]{--wall:radial-gradient(ellipse 90% 60% at 30% 100%,#6cc23a 0 60%,transparent 61%),radial-gradient(ellipse 80% 50% at 90% 105%,#4fa52a 0 60%,transparent 61%),linear-gradient(#2f6fd6,#8dc3f5);--fg:#fff;--ac:#245edb;--ink:#fff;--pn:#ece9d8;--tx:#111;--ln:#0b3fa8}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--wall) #000;color:var(--fg);font:14px/1.45 "Courier New",ui-monospace,monospace}
button,input,textarea{font:inherit;color:inherit}
button{background:var(--pn);color:var(--tx);border:2px solid var(--ln);padding:.3rem .7rem;cursor:pointer}
button:hover,button:focus-visible{background:var(--ac);color:var(--ink);outline:none}
input,textarea{background:var(--pn);color:var(--tx);border:2px solid var(--ln);padding:.35rem .5rem;min-width:0}
#boot{position:fixed;inset:0;z-index:9999;background:#000;color:#C6F22D;display:grid;place-items:center;padding:1rem}
#boot .box{border:2px solid #C6F22D;padding:1.5rem;max-width:30rem;width:100%;box-shadow:8px 8px 0 rgba(198,242,45,.25)}
#boot h1{margin:0 0 .3rem;font-size:1.4rem}
#boot p{margin:.2rem 0 1rem;color:#f5f5f5}
#boot input{width:100%;margin-bottom:.8rem;background:#000;color:#C6F22D;border-color:#C6F22D}
#boot button{background:#000;color:#C6F22D;border-color:#C6F22D}
#boot button:hover,#boot button:focus-visible{background:#C6F22D;color:#000}
#desk{position:absolute;inset:0 0 28px 0}
#icons{position:absolute;inset:12px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,92px);grid-auto-columns:96px;gap:4px;align-content:start;justify-content:start;pointer-events:none}
.ico{width:92px;height:88px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;cursor:default;user-select:none;touch-action:none;pointer-events:auto;font-size:12px;position:relative;word-break:break-all}
.ico b{font-size:28px;line-height:1}
.ico span{padding:0 3px}
.ico:hover span,.ico:focus-visible span{background:var(--ac);color:var(--ink)}
.ico.drag{z-index:50;opacity:.85}
.win{position:absolute;background:var(--pn);color:var(--tx);border:2px solid var(--ln);box-shadow:6px 6px 0 rgba(0,0,0,.45);display:flex;flex-direction:column;max-width:100vw;max-height:calc(100% - 4px)}
.tb{background:var(--ac);color:var(--ink);padding:.2rem .5rem;display:flex;justify-content:space-between;align-items:center;cursor:move;touch-action:none;user-select:none;font-weight:bold}
.tb button{padding:0 .5rem;background:var(--ink);color:var(--ac);border:0}
.wb{padding:.8rem;overflow:auto;flex:1;min-height:0}
.txt{white-space:pre-wrap;margin:0;font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:.6rem}
.card{border:2px solid var(--ln);padding:.5rem;cursor:pointer;background:transparent;text-align:left;color:var(--tx)}
.card img,.gal img{width:100%;display:block;aspect-ratio:16/10;object-fit:cover;margin-bottom:.4rem}
table{border-collapse:collapse;width:100%}td,th{border:1px solid var(--ln);padding:.3rem .5rem;text-align:left;vertical-align:top}
.tag{font-weight:bold;white-space:nowrap}
.row{display:flex;gap:.5rem;margin:.5rem 0;flex-wrap:wrap;align-items:center}
.row input{flex:1}
.mq{overflow:hidden;white-space:nowrap;border:2px solid var(--ln);padding:.3rem}
.mq span{display:inline-block;padding-left:100%;animation:mq 12s linear infinite}
@keyframes mq{to{transform:translateX(-100%)}}
.note{border:1px dashed var(--ln);padding:.4rem;margin:.4rem 0}
.note small{opacity:.75;display:block}
#status{position:absolute;left:0;right:0;bottom:0;height:28px;background:var(--ac);color:var(--ink);padding:0 .6rem;line-height:28px;white-space:nowrap;overflow:hidden;z-index:9000;font-weight:bold}
#wx{position:absolute;top:12px;right:12px;border:2px solid var(--ln);background:var(--pn);color:var(--tx);padding:.4rem .7rem;z-index:5;text-align:right}
#relay{position:absolute;right:12px;bottom:40px;width:260px;border:2px solid var(--ln);background:var(--pn);color:var(--tx);padding:.5rem;z-index:5}
#relay .row{margin:.3rem 0 0}
canvas{background:#000;border:2px solid var(--ln);max-width:100%;touch-action:none}
@media(max-width:699px){
.win{inset:0 0 28px 0!important;width:auto!important;height:auto!important;max-height:none;box-shadow:none}
#wx{top:6px;right:6px;font-size:12px}
#relay{display:none}
}
@media(prefers-reduced-motion:reduce){.mq span{animation:none;padding-left:0}}
</style>
</head>
<body>
<div id="boot">
  <div class="box">
    <h1>zakaryae-os v1.0</h1>
    <p>Who is at the keyboard?</p>
    <input id="bootName" type="text" maxlength="24" placeholder="Your name" autocomplete="off">
    <div class="row"><button id="bootEnter" type="button">[ Enter ]</button><button id="bootSkip" type="button">[ Skip ]</button></div>
  </div>
</div>
<div id="desk"><div id="icons"></div></div>
<div id="wx">weather: loading…</div>
<form id="relay" onsubmit="return false">
  <b>Broadcast_Relay</b>
  <div class="row"><input id="relayMail" type="email" placeholder="you@email.com" aria-label="Email"><button id="relayBtn" type="button">Subscribe</button></div>
  <div id="relayMsg"></div>
</form>
<div id="status">ready.</div>

<script>
(function () {
  'use strict';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var esc = function (s) { var d = document.createElement('div'); d.textContent = s == null ? '' : s; return d.innerHTML; };
  var store = {
    get: function (k, d) { try { var v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  };
  var user = 'Guest', DATA = null, booted = false;
  var FALLBACK = { siteSettings: { github: 'https://github.com/zgourrag', linkedin: 'https://www.linkedin.com/in/zakaryae', instagram: 'https://www.instagram.com/zakaryve/', weatherCity: 'Rabat, Morocco' }, work: [], posts: [], wip: [] };

  /* ---------- BOOT (bound once, null-safe) ---------- */
  function finishBoot(name) {
    if (booted) return;
    booted = true;
    user = (name || '').trim() || 'Guest';
    store.set('os_name', user);
    var b = $('#boot');
    if (b) b.style.display = 'none';
    try { startOS(); } catch (e) { console.error('startOS failed', e); }
  }
  function initBoot() {
    var inp = $('#bootName'), en = $('#bootEnter'), sk = $('#bootSkip');
    if (en) en.addEventListener('click', function () { finishBoot(inp ? inp.value : ''); });
    if (sk) sk.addEventListener('click', function () { finishBoot('Guest'); });
    if (inp) inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') finishBoot(inp.value); });
    if (inp) inp.focus();
  }

  /* ---------- STATUS BAR TYPEWRITER ---------- */
  var tw = null;
  function say(t) {
    var s = $('#status'); if (!s) return;
    clearInterval(tw); var i = 0; s.textContent = '';
    tw = setInterval(function () { s.textContent = '> ' + t.slice(0, ++i); if (i >= t.length) clearInterval(tw); }, 18);
  }
  document.addEventListener('mouseover', function (e) {
    var el = e.target.closest ? e.target.closest('[data-tip]') : null;
    if (el) say(el.getAttribute('data-tip'));
  });
  document.addEventListener('focusin', function (e) { var el = e.target.closest && e.target.closest('[data-tip]'); if (el) say(el.getAttribute('data-tip')); });

  /* ---------- WINDOWS ---------- */
  var z = 100;
  function win(id, title, w, h) {
    var ex = document.getElementById('w-' + id);
    if (ex) { ex.style.zIndex = ++z; return null; }
    var el = document.createElement('div');
    el.className = 'win'; el.id = 'w-' + id; el.style.zIndex = ++z;
    var n = document.querySelectorAll('.win').length;
    el.style.width = Math.min(w || 480, innerWidth - 8) + 'px';
    el.style.left = Math.max(4, Math.min(60 + n * 28, innerWidth - (w || 480) - 8)) + 'px';
    el.style.top = (40 + n * 28) + 'px';
    el.innerHTML = '<div class="tb"><span>' + esc(title) + '</span><button type="button" aria-label="Close">x</button></div><div class="wb"></div>';
    $('#desk').appendChild(el);
    el.addEventListener('pointerdown', function () { el.style.zIndex = ++z; });
    var tb = $('.tb', el);
    $('button', tb).addEventListener('click', function () { el.dispatchEvent(new Event('close')); el.remove(); });
    tb.addEventListener('pointerdown', function (e) {
      if (e.target.tagName === 'BUTTON' || innerWidth < 700) return;
      var sx = e.clientX - el.offsetLeft, sy = e.clientY - el.offsetTop;
      tb.setPointerCapture(e.pointerId);
      function mv(ev) { el.style.left = Math.max(0, Math.min(ev.clientX - sx, innerWidth - 60)) + 'px'; el.style.top = Math.max(0, Math.min(ev.clientY - sy, innerHeight - 60)) + 'px'; }
      function up() { tb.removeEventListener('pointermove', mv); tb.removeEventListener('pointerup', up); }
      tb.addEventListener('pointermove', mv); tb.addEventListener('pointerup', up);
    });
    el.__body = $('.wb', el);
    return el;
  }

  /* ---------- APPS ---------- */
  var CV = 'ZAKARYAE\nCreative technologist -> software engineer\n\n[2018-2025] CREATIVE DIRECTION\nDigital marketing, brand identity and campaign\nstrategy. Shaped the facade of products, from the\nfirst idea to the last pixel.\n\n[NOW] 1337, MOROCCO\nStudying software engineering. C, pointers, memory\nmanagement, data structures. Rebuilding libft from\nscratch and learning how code meets hardware.\n\n[PRINCIPLE]\nStrip the abstraction. Understand allocation,\nownership and failure modes first.\n\nContact: hello@zakaryae.me';

  function openCV() { var w = win('cv', 'zakaryae.txt', 460); if (!w) return; w.__body.innerHTML = '<pre class="txt">' + esc(CV) + '</pre>'; }

  function openPortfolio() {
    var w = win('port', 'Portfolio.exe', 640); if (!w) return;
    var b = w.__body, work = DATA.work || [];
    function list() {
      b.innerHTML = work.length ? '<div class="grid"></div>' : 'No projects yet. Add one in /master.';
      var g = $('.grid', b); if (!g) return;
      work.forEach(function (p, i) {
        var c = document.createElement('button'); c.className = 'card'; c.type = 'button';
        c.innerHTML = (p.images && p.images[0] ? '<img alt="" src="' + esc(p.images[0]) + '">' : '') + '<b>' + esc(p.title) + '</b><br>' + esc(p.summary);
        c.addEventListener('click', function () { detail(p); });
        g.appendChild(c);
      });
    }
    function detail(p) {
      var imgs = p.images || [], i = 0;
      b.innerHTML = '<button type="button" id="pb">&lt; back</button><h3>' + esc(p.title) + '</h3><div class="gal"><img alt=""><div class="row"><button type="button" id="gp">&lt;</button><span id="gc"></span><button type="button" id="gn">&gt;</button></div></div><div>' + (p.description || '') + '</div>';
      var im = $('img', b);
      function show() { if (!imgs.length) { $('.gal', b).style.display = 'none'; return; } im.src = imgs[i]; $('#gc', b).textContent = (i + 1) + ' / ' + imgs.length; }
      $('#pb', b).addEventListener('click', list);
      $('#gp', b).addEventListener('click', function () { i = (i - 1 + imgs.length) % imgs.length; show(); });
      $('#gn', b).addEventListener('click', function () { i = (i + 1) % imgs.length; show(); });
      show();
    }
    list();
  }

  function openBlog() {
    var w = win('blog', 'Blog.txt', 560, 0); if (!w) return;
    var b = w.__body, posts = (DATA.posts || []).slice().sort(function (a, c) { return a.date < c.date ? 1 : -1; });
    b.innerHTML = '<div class="row" id="pl"></div><pre class="txt" id="pbody"></pre>';
    function pick(p) { $('#pbody', b).textContent = p.title + '  (' + p.date + ')\n\n' + p.body; }
    posts.forEach(function (p) { var x = document.createElement('button'); x.type = 'button'; x.textContent = p.title; x.addEventListener('click', function () { pick(p); }); $('#pl', b).appendChild(x); });
    if (posts[0]) pick(posts[0]); else $('#pbody', b).textContent = 'No posts yet.';
  }

  function tagFor(s) {
    s = (s || '').toLowerCase();
    if (s.indexOf('segfault') > -1) return '[SEGFAULT]';
    if (s.indexOf('progress') > -1 || s === 'wip') return '[WIP]';
    return '[COMPLETED]';
  }
  function openProjects() {
    var w = win('proj', 'Projects.dir', 620); if (!w) return;
    var rows = (DATA.wip || []).map(function (r) { return '<tr><td>' + esc(r.file) + '</td><td>' + esc(r.type) + '</td><td class="tag">' + tagFor(r.status) + '</td><td>' + esc(r.note) + '</td><td>' + esc(r.date) + '</td></tr>'; }).join('');
    w.__body.innerHTML = '<table><tr><th>File</th><th>Type</th><th>Status</th><th>Note</th><th>Modified</th></tr>' + (rows || '<tr><td colspan=5>Empty.</td></tr>') + '</table>';
  }

  function openLinks() {
    var w = win('links', 'Links.dir', 360); if (!w) return;
    var s = DATA.siteSettings || {};
    var L = [['github.lnk', s.github, 'Read the source.'], ['linkedin.lnk', s.linkedin, 'The professional face.'], ['instagram.lnk', 'https://www.instagram.com/zakaryve/', 'Pictures, not pointers.']];
    w.__body.innerHTML = L.map(function (l) { return '<p><a data-tip="' + esc(l[2]) + '" style="color:var(--tx)" target="_blank" rel="noopener" href="' + esc(l[1]) + '">' + esc(l[0]) + '</a></p>'; }).join('');
  }

  function setTheme(t) { if (t === 'swiss') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', t); store.set('os_theme', t); }
  function openThemes() {
    var w = win('themes', 'Themes.dir', 340); if (!w) return;
    var T = [['Env_Swiss.cfg', 'swiss', 'Black, white, lime. Zero noise.'], ['Env_Acid.cfg', 'acid', 'Tie-dye for the sleep-deprived.'], ['Env_Matrix.cfg', 'matrix', 'There is no spoon, only stdout.'], ['Env_XP.cfg', 'xp', 'Hills. Always the hills.']];
    T.forEach(function (t) { var b = document.createElement('button'); b.type = 'button'; b.className = 'card'; b.style.cssText = 'display:block;width:100%;margin-bottom:.5rem'; b.textContent = t[0]; b.setAttribute('data-tip', t[2]); b.addEventListener('click', function () { setTheme(t[1]); }); w.__body.appendChild(b); });
  }

  var TRACKS = [['Lo-fi Beat 01 (placeholder)', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3'], ['Boom-bap Sketch 02 (placeholder)', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3'], ['Rainy Day Loop 03 (placeholder)', 'https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3']];
  function openVMPC() {
    var w = win('vmpc', 'VMPC.exe', 380); if (!w) return;
    var a = new Audio(), i = 0, b = w.__body;
    b.innerHTML = '<div class="mq"><span id="mt"></span></div><div class="row"><button type="button" id="pv">|&lt;</button><button type="button" id="pp">play</button><button type="button" id="nx">&gt;|</button></div><div id="ps"></div><div class="row"><input id="rec" placeholder="Recommend a track"><button type="button" id="rb">Send</button></div><div id="rm"></div>';
    function load(play) { a.src = TRACKS[i][1]; $('#mt', b).textContent = 'Now playing: ' + TRACKS[i][0] + '  ///  Nujabes-inspired hip-hop sessions  ///  '; if (play) a.play().catch(function () { $('#ps', b).textContent = 'Cannot play this track here. Check your connection.'; }); }
    a.addEventListener('play', function () { $('#pp', b).textContent = 'pause'; $('#ps', b).textContent = ''; });
    a.addEventListener('pause', function () { $('#pp', b).textContent = 'play'; });
    a.addEventListener('ended', function () { i = (i + 1) % TRACKS.length; load(true); });
    $('#pp', b).addEventListener('click', function () { if (!a.src) load(false); a.paused ? a.play().catch(function () { $('#ps', b).textContent = 'Cannot play this track here. Check your connection.'; }) : a.pause(); });
    $('#nx', b).addEventListener('click', function () { i = (i + 1) % TRACKS.length; load(!a.paused); });
    $('#pv', b).addEventListener('click', function () { i = (i - 1 + TRACKS.length) % TRACKS.length; load(!a.paused); });
    $('#rb', b).addEventListener('click', function () { var v = $('#rec', b).value.trim(); if (!v) return; var r = store.get('os_recs', []); r.push({ t: v, by: user }); store.set('os_recs', r); $('#rec', b).value = ''; $('#rm', b).textContent = 'Saved. Thanks, ' + user + '.'; });
    load(false);
    w.addEventListener('close', function () { a.pause(); a.src = ''; });
  }

  function openSnake() {
    var w = win('snake', 'Snake.exe', 340); if (!w) return;
    var b = w.__body, N = 15, S = 20;
    b.innerHTML = '<div id="sc"></div><canvas width="300" height="300"></canvas><div class="row"><button type="button" data-d="L">&lt;</button><button type="button" data-d="U">^</button><button type="button" data-d="D">v</button><button type="button" data-d="R">&gt;</button><button type="button" id="rs">restart</button></div><div id="lb"></div>';
    var cv = $('canvas', b), c = cv.getContext('2d'), sn, dr, nd, fd, sc, over, tm;
    var V = { L: [-1, 0], R: [1, 0], U: [0, -1], D: [0, 1] };
    function board() {
      var hs = store.get('os_snake', 0), mock = [['ptr_master', 42], ['segfault_sam', 31], ['malloc_mo', 18]];
      mock.push([user + ' (best)', hs]); mock.sort(function (x, y) { return y[1] - x[1]; });
      $('#lb', b).innerHTML = '<b>Leaderboard</b><br>' + mock.map(function (m, k) { return (k + 1) + '. ' + esc(m[0]) + ' ' + m[1]; }).join('<br>');
    }
    function reset() { sn = [[7, 7], [6, 7], [5, 7]]; dr = 'R'; nd = 'R'; sc = 0; over = false; food(); clearInterval(tm); tm = setInterval(tick, 120); board(); }
    function food() { do { fd = [Math.floor(Math.random() * N), Math.floor(Math.random() * N)]; } while (sn.some(function (p) { return p[0] === fd[0] && p[1] === fd[1]; })); }
    function tick() {
      var o = { L: 'R', R: 'L', U: 'D', D: 'U' }; if (o[nd] !== dr) dr = nd;
      var h = [sn[0][0] + V[dr][0], sn[0][1] + V[dr][1]];
      if (h[0] < 0 || h[1] < 0 || h[0] >= N || h[1] >= N || sn.some(function (p) { return p[0] === h[0] && p[1] === h[1]; })) { over = true; clearInterval(tm); if (sc > store.get('os_snake', 0)) store.set('os_snake', sc); board(); }
      else { sn.unshift(h); if (h[0] === fd[0] && h[1] === fd[1]) { sc++; food(); } else sn.pop(); }
      var cs = getComputedStyle(document.documentElement);
      c.fillStyle = '#000'; c.fillRect(0, 0, 300, 300);
      c.fillStyle = '#ff3e3e'; c.fillRect(fd[0] * S + 2, fd[1] * S + 2, S - 4, S - 4);
      c.fillStyle = '#C6F22D'; sn.forEach(function (p) { c.fillRect(p[0] * S + 1, p[1] * S + 1, S - 2, S - 2); });
      $('#sc', b).textContent = 'Score ' + sc + '  Best ' + store.get('os_snake', 0) + (over ? '  GAME OVER' : '');
    }
    function key(e) { var m = { ArrowLeft: 'L', ArrowRight: 'R', ArrowUp: 'U', ArrowDown: 'D' }[e.key]; if (m && document.getElementById('w-snake')) { nd = m; e.preventDefault(); } }
    document.addEventListener('keydown', key);
    b.querySelectorAll('[data-d]').forEach(function (x) { x.addEventListener('click', function () { nd = x.getAttribute('data-d'); }); });
    $('#rs', b).addEventListener('click', reset);
    w.addEventListener('close', function () { clearInterval(tm); document.removeEventListener('keydown', key); });
    reset();
  }

  function openWall() {
    var w = win('wall', 'Wall.exe', 420); if (!w) return;
    var b = w.__body;
    b.innerHTML = '<div class="row"><input id="wn" maxlength="140" placeholder="Leave a note (anonymous)"><button type="button" id="wp">Post</button></div><div id="wm"></div><div id="wl"></div>';
    function render() { $('#wl', b).innerHTML = store.get('os_wall', []).slice().reverse().map(function (n) { return '<div class="note">' + esc(n.t) + '<small>' + esc(n.by) + ' | ' + esc(n.at) + ' | ' + esc(n.geo) + '</small></div>'; }).join('') || 'No notes yet. Be the first.'; }
    function save(geo) {
      var v = $('#wn', b).value.trim(); if (!v) return;
      var l = store.get('os_wall', []); l.push({ t: v, by: user, at: new Date().toLocaleString(), geo: geo }); store.set('os_wall', l);
      $('#wn', b).value = ''; $('#wm', b).textContent = ''; render();
    }
    $('#wp', b).addEventListener('click', function () {
      if (!$('#wn', b).value.trim()) return;
      if (!navigator.geolocation) return save('location unavailable');
      $('#wm', b).textContent = 'Locating…';
      navigator.geolocation.getCurrentPosition(function (p) { save(p.coords.latitude.toFixed(2) + ', ' + p.coords.longitude.toFixed(2)); }, function () { save('location denied'); }, { timeout: 6000 });
    });
    render();
  }

  var APPS = [
    ['zakaryae.txt', 'TXT', 'A CV with fewer semicolons than you would expect.', openCV],
    ['Portfolio.exe', 'EXE', 'Case studies. Click responsibly.', openPortfolio],
    ['Blog.txt', 'TXT', 'Thoughts, unbuffered.', openBlog],
    ['Projects.dir', 'DIR', 'Everything I started. Some even finished.', openProjects],
    ['Links.dir', 'DIR', 'Portals to the outside world.', openLinks],
    ['VMPC.exe', 'MP3', 'Boom-bap for debugging sessions.', openVMPC],
    ['Snake.exe', 'GAME', 'Do not eat yourself.', openSnake],
    ['Wall.exe', 'WALL', 'Leave a mark. Literally, with coordinates.', openWall],
    ['Themes.dir', 'CFG', 'Change the whole mood in one click.', openThemes]
  ];

  /* ---------- ICONS: draggable, dblclick launches (tap on touch) ---------- */
  function buildIcons() {
    var box = $('#icons'); box.innerHTML = '';
    APPS.forEach(function (a) {
      var el = document.createElement('div'); el.className = 'ico'; el.tabIndex = 0; el.setAttribute('data-tip', a[2]);
      el.innerHTML = '<b>[' + esc(a[1]) + ']</b><span>' + esc(a[0]) + '</span>';
      var ox = 0, oy = 0, moved = false, sx, sy;
      function launch() { try { a[3](); } catch (e) { console.error(e); } }
      el.addEventListener('pointerdown', function (e) {
        sx = e.clientX; sy = e.clientY; moved = false; el.setPointerCapture(e.pointerId);
        var bx = ox, by = oy;
        function mv(ev) {
          var dx = ev.clientX - sx, dy = ev.clientY - sy;
          if (!moved && Math.abs(dx) + Math.abs(dy) < 6) return;
          moved = true; el.classList.add('drag'); ox = bx + dx; oy = by + dy; el.style.translate = ox + 'px ' + oy + 'px';
        }
        function up(ev) {
          el.removeEventListener('pointermove', mv); el.removeEventListener('pointerup', up); el.classList.remove('drag');
          var r = el.getBoundingClientRect(), dx2 = 0, dy2 = 0;
          if (r.left < 0) dx2 = -r.left; if (r.top < 0) dy2 = -r.top;
          if (r.right > innerWidth) dx2 = innerWidth - r.right; if (r.bottom > innerHeight - 28) dy2 = innerHeight - 28 - r.bottom;
          if (dx2 || dy2) { ox += dx2; oy += dy2; el.style.translate = ox + 'px ' + oy + 'px'; }
          if (!moved && ev.pointerType !== 'mouse') launch();
        }
        el.addEventListener('pointermove', mv); el.addEventListener('pointerup', up);
      });
      el.addEventListener('dblclick', launch);
      el.addEventListener('keydown', function (e) { if (e.key === 'Enter') launch(); });
      box.appendChild(el);
    });
  }

  /* ---------- WEATHER ---------- */
  function weather() {
    var el = $('#wx');
    function go(lat, lon, label) {
      fetch('https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon + '&current_weather=true')
        .then(function (r) { return r.json(); })
        .then(function (d) { el.textContent = label + ': ' + Math.round(d.current_weather.temperature) + '°C, wind ' + Math.round(d.current_weather.windspeed) + ' km/h'; })
        .catch(function () { el.textContent = label + ': weather unavailable'; });
    }
    var city = (DATA.siteSettings && DATA.siteSettings.weatherCity) || 'Rabat, Morocco';
    if (navigator.geolocation) navigator.geolocation.getCurrentPosition(function (p) { go(p.coords.latitude, p.coords.longitude, 'Your location'); }, function () { go(34.02, -6.84, city); }, { timeout: 5000 });
    else go(34.02, -6.84, city);
  }

  function relay() {
    var btn = $('#relayBtn'), m = $('#relayMail'), msg = $('#relayMsg');
    if (!btn || !m || !msg) return;
    btn.addEventListener('click', function () {
      var v = m.value.trim();
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(v)) { msg.textContent = 'Enter a valid email address.'; return; }
      var l = store.get('os_news', []); l.push(v); store.set('os_news', l);
      m.value = ''; msg.textContent = 'Subscribed. Welcome aboard, ' + user + '.';
    });
  }

  /* ---------- START ---------- */
  function startOS() {
    setTheme(store.get('os_theme', 'swiss'));
    buildIcons(); relay(); weather();
    say('Welcome, ' + user + '. Double-click an icon to launch it.');
  }

  function load() {
    initBoot();
    fetch('data.json').then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (d) { DATA = d; }).catch(function () { DATA = FALLBACK; });
    DATA = DATA || FALLBACK;
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', load); else load();
})();
</script>
</body>
