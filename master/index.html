<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>OS Control Panel</title>
  <link href="config.yml" type="text/yaml" rel="cms-config-url">
  <style>
    html, body {
      margin: 0;
      min-height: 100vh;
      background: #0f0f0f;
      color: #f5f5f5;
      font-family: 'Segoe UI', sans-serif;
    }
    body {
      display: grid;
      place-items: center;
    }
    .wrap {
      padding: 2rem;
      border: 2px solid #c6f22d;
      background: rgba(255,255,255,0.03);
      box-shadow: 8px 8px 0 rgba(198, 242, 45, 0.2);
    }
    h1 {
      margin: 0 0 1rem;
      font-size: 2rem;
      color: #c6f22d;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>OS Control Panel</h1>
  </div>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
</body>
</html>
