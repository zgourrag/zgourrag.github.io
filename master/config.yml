# Sveltia CMS config for zakaryae.me/master (Decap-compatible syntax)
backend:
  name: github
  repo: zgourrag/zgourrag.github.io
  branch: main # Change to "master" if your default branch on GitHub is named master

# For local testing run `npx decap-server`, then uncomment:
# local_backend: true

site_url: https://zakaryae.me
display_url: https://zakaryae.me
publish_mode: simple
media_folder: images/uploads             # where uploaded photos are committed (repo path)
public_folder: /images/uploads           # how data.json refers to them on the site

collections:
  - name: content
    label: Site Content
    files:
      # ONE file entry on purpose: data.json holds all lists, so each entry must save the whole file.
      - name: data
        label: Site settings, Portfolio, Blog, Projects and cc.exe
        file: data.json
        fields:
          - label: Site settings
            name: siteSettings
            widget: object
            collapsed: false
            fields:
              - { label: Browser tab title, name: siteTitle, widget: string }
              - { label: Badge name, name: profileName, widget: string }
              - { label: Badge intro line, name: profileIntro, widget: string }
              - { label: Profile picture (upload or paste a URL), name: profileImage, widget: image, required: false }
              - { label: zakaryae.txt (full CV text), name: cv, widget: text, hint: "Plain text. Line breaks are kept." }
              - { label: Desktop quote, name: quoteText, widget: string }
              - { label: Quote author, name: quoteAuthor, widget: string }
              - { label: Email, name: email, widget: string, required: false }
              - { label: GitHub URL, name: github, widget: string }
              - { label: LinkedIn URL, name: linkedin, widget: string }
              - { label: Instagram URL, name: instagram, widget: string }
              - { label: Newsletter relay access key (Web3Forms; leave empty for demo mode), name: relayAccessKey, widget: string, required: false,
                  hint: "Create a free key at web3forms.com using gourragui@zakaryae.me. The key decides who receives the emails." }
              - { label: Newsletter relay endpoint (Web3Forms or a Formspree URL), name: relayEndpoint, widget: string, required: false }
              - { label: Status bar idle text, name: statusIdle, widget: string }
              - label: Status bar hints (shown when hovering an icon)
                name: statusTips
                widget: list
                required: false
                summary: "{{fields.label}}"
                fields:
                  - { label: Icon label (exactly as on the desktop, e.g. Wall.exe), name: label, widget: string }
                  - { label: Hint text, name: text, widget: string }

          - label: Portfolio projects
            name: work
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { label: Title, name: title, widget: string }
              - { label: Card summary, name: summary, widget: string }
              - label: Images (shown in order in the case study; the first is the thumbnail)
                name: images
                widget: list
                required: false
                field: { label: Image, name: image, widget: image }
              - { label: Description, name: description, widget: text,
                  hint: "Separate paragraphs with a blank line. A paragraph starting with < is treated as HTML." }

          - label: Blog posts
            name: posts
            widget: list
            summary: "{{fields.date}} - {{fields.title}}"
            fields:
              - { label: Title (file name style, e.g. my_post.txt), name: title, widget: string }
              - { label: Date, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
              - { label: Body, name: body, widget: text, hint: "Separate paragraphs with a blank line." }

          - label: Unfinished projects
            name: wip
            widget: list
            required: false
            summary: "{{fields.file}}"
            fields:
              - { label: File name, name: file, widget: string }
              - { label: Type, name: type, widget: string }
              - { label: Status, name: status, widget: string }
              - { label: Note, name: note, widget: string }
              - { label: Modified, name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }

          - label: cc.exe study modules (Common Core)
            name: ccModules
            widget: list
            required: false
            summary: "{{fields.title}}"
            fields:
              - { label: Id (short, no spaces, unique), name: id, widget: string }
              - { label: Module title, name: title, widget: string }
              - { label: XP for completing the whole module, name: xp, widget: number, value_type: int, min: 10, default: 30 }
              - label: Memory blocks (short cards; keep each small)
                name: cards
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: Title, name: title, widget: string }
                  - { label: Definition (strict, technical), name: definition, widget: text }
                  - { label: Mental model (visual metaphor), name: metaphor, widget: text }
                  - { label: Diagram (plain text or ASCII art), name: visual, widget: text, required: false }
                  - { label: Code snippet, name: code, widget: text, required: false }
                  - { label: Recall question, name: recall, widget: string, required: false }
                  - { label: Recall answer, name: recallAnswer, widget: text, required: false }
              - label: Memory Leak Spotter
                name: leak
                widget: object
                fields:
                  - { label: Prompt, name: prompt, widget: string }
                  - { label: Buggy code (one statement per line), name: code, widget: text }
                  - { label: Buggy line number (1 = first line), name: answer, widget: number, value_type: int, min: 1 }
                  - { label: Hint (shown after two misses), name: hint, widget: string, required: false }
                  - { label: Explanation, name: explain, widget: text }
              - label: Peer-evaluation questions
                name: peer
                widget: list
                summary: "{{fields.q}}"
                fields:
                  - { label: Evaluator question, name: q, widget: string }
                  - { label: Model answer, name: a, widget: text }
